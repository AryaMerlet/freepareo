name: Deploy to Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: freepareo_deploy

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 212.227.52.231
          username: neil
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /srv/freepareo
            git pull origin dev
            npm install
            npm run build
